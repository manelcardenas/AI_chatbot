[project]
name = "AI_chatbot"
version = "0.1.0"
description = "A proof of concept chatbot application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["langchain-core>=1.2.1", "langsmith>=0.4.60"]

[dependency-groups]
dev = ["pre-commit>=4.5.0", "ruff>=0.14.9"]


[tool.setuptools]
package-dir = { "" = "." }
packages = ["src"]

# Ruff - fast linter and formatter
[tool.ruff]
line-length = 120
target-version = "py311"

lint.select = ["E", "F", "W", "I", "ANN", "UP"]
lint.ignore = ["ANN002", "ANN003", "E501", "E203"]
lint.exclude = [".venv", "__pycache__", ".git"]

# Code formatting
[tool.ruff.format]
